[project]
name = "polish"
version = "1.0.0"
description = "Polish - Make it shine. A Claude-powered grammar fixer and rephraser."
requires-python = ">=3.10"
dependencies = ["anthropic>=2.6", "pydantic>=2", "PySide6>=6.7", "pynput>=1.7", "pyperclip>=1.9"]

[project.scripts]
polish = "wa_desktop.app:main"

[tool.setuptools]
packages = ["wa_core", "wa_desktop", "wa_desktop.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
